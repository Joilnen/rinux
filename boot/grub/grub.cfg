set timeout=0
set default=0

# Mantem o console do GRUB no modo texto VGA. Assim o kernel encontra o
# framebuffer de texto em 0xB8000, como em um PC BIOS tradicional.
terminal_output console
set gfxpayload=text

insmod multiboot2

menuentry "Rust VGA Kernel (x86_64)" {
    multiboot2 /boot/kernel.elf
    boot
}
